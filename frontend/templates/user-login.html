
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Candidate Login — HireCraft AI</title>
<link rel="stylesheet" href="/static/css/main.css"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-body">
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <span class="brand-icon"><i class="fas fa-brain"></i></span>
    <span class="brand-name">HireCraft<span class="accent">AI</span></span>
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Home</a>
    <a href="company-login.html" class="nav-link">Company</a>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon user-icon">
        <i class="fas fa-user-tie"></i>
      </div>
      <h2>Candidate Login</h2>
      <p>Enter your email address to continue</p>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" id="userEmail"
               placeholder="yourname@email.com"
               class="form-input"/>
      </div>
    </div>

    <div id="loginError" class="alert alert-error hidden">
      Please enter a valid email address
    </div>

    <button class="btn-primary full-width" id="loginBtn" onclick="doLogin()">
      <i class="fas fa-arrow-right"></i> Continue
    </button>

    <div class="auth-divider"><span>or</span></div>

    <a href="index.html" class="btn-ghost full-width">
      <i class="fas fa-home"></i> Back to Home
    </a>
  </div>
</div>

<script>
  // If already logged in skip login page
  fetch('/api/user/session', { credentials: 'include' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.user_email) {
        window.location.href = 'user-dashboard.html';
      }
    })
    .catch(function() {});

  // Press Enter to login
  document.getElementById('userEmail').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    var email = document.getElementById('userEmail').value.trim();
    var errEl = document.getElementById('loginError');
    var btn   = document.getElementById('loginBtn');

    errEl.classList.add('hidden');

    if (!email || email.indexOf('@') === -1 || email.indexOf('.') === -1) {
      errEl.textContent = 'Please enter a valid email address';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Please wait...';

    fetch('/api/user/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email: email })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.success) {
        window.location.href = 'user-dashboard.html';
      } else {
        errEl.textContent = d.error || 'Login failed. Try again.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue';
      }
    })
    .catch(function() {
      errEl.textContent = 'Cannot connect to server. Make sure backend is running.';
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-arrow-right"></i> Continue';
    });
  }
</script>
</body>
</html>
